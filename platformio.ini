; PlatformIO Project Configuration File
;
; Consolidated configuration for the Thermal Camera project and its component tests.
; Easily switch between environments using the VS Code PlatformIO status bar switcher
; or via the CLI:
;   pio run -e main               (Build main firmware)
;   pio run -e test-esp32-s3      (Build ESP32-S3 hardware & diagnostic test)
;   pio run -e test-mlx90640      (Build MLX90640 thermal sensor stream test)
;   pio run -e test-tft-display   (Build TFT display benchmark & test suite)
;
; To flash any environment:
;   pio run -e <env_name> -t upload

[platformio]
default_envs = main

; Base hardware configuration for ESP32-S3 DevKitC-1 (Canonical configuration)
[esp32s3_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_filters = send_on_enter

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; ==============================================================================
; 1. MAIN FIRMWARE
; ==============================================================================
[env:main]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
build_src_filter = +<*> -<.git/> -<.svn/>
lib_deps =
    lvgl/lvgl @ ^8.3.11
    adafruit/Adafruit ILI9341 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit MLX90640 @ ^1.1.2
    adafruit/Adafruit NeoPixel @ ^1.15.5

; ==============================================================================
; 2. COMPONENT TEST: ESP32-S3 (SoC, FreeRTOS, PSRAM, Wi-Fi & NeoPixel)
; ==============================================================================
[env:test-esp32-s3]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -I component-tests/esp32-s3
build_src_filter =
    -<*>
    +<../component-tests/esp32-s3/*.cpp>
lib_deps =
    WiFi
    adafruit/Adafruit NeoPixel @ ^1.15.5

; ==============================================================================
; 3. COMPONENT TEST: MLX90640 Thermal Sensor
; ==============================================================================
[env:test-mlx90640]
extends = esp32s3_base
monitor_speed = 921600
build_src_filter =
    -<*>
    +<../component-tests/mlx90640/*.cpp>
lib_deps =
    adafruit/Adafruit MLX90640 @ ^1.1.2
    links2004/WebSockets @ ^2.4.1

; ==============================================================================
; 4. COMPONENT TEST: 2.8" SPI TFT Display (ILI9341)
; ==============================================================================
[env:test-tft-display]
extends = esp32s3_base
build_src_filter =
    -<*>
    +<../component-tests/tft-display/*.cpp>
lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.1
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
